<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Verify 2FA - JoyHotels</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="{{ url_for('static', filename='dashboard.css') }}">
    <style>
        body {
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            background: #0f172a;
        }

        .login-card {
            background: rgba(30, 41, 59, 0.7);
            padding: 2.5rem;
            border-radius: 1rem;
            width: 100%;
            max-width: 400px;
            backdrop-filter: blur(12px);
            border: 1px solid rgba(255, 255, 255, 0.1);
            text-align: center;
        }

        .otp-input {
            letter-spacing: 0.5em;
            font-size: 1.5rem;
            text-align: center;
            font-weight: 700;
        }
    </style>
</head>

<body>
    <div class="login-card">
        <div style="font-size: 3rem; margin-bottom: 1rem;">🔒</div>
        <h2 style="color:white; margin-bottom: 0.5rem;">Two-Factor Auth</h2>
        <p style="color: #94a3b8; margin-bottom: 2rem;">Enter the 6-digit code sent to your email.</p>

        <form id="otpForm" onsubmit="verifyOtp(event)">
            <div class="form-group">
                <input type="text" id="otp" class="form-control otp-input" placeholder="000000" maxlength="6" required
                    autofocus>
            </div>
            <button type="submit" class="btn btn-primary" style="width: 100%;">Verify & Login</button>
        </form>
        <p class="mt-3" style="margin-top: 1rem;">
            <a href="/login" style="color: #94a3b8; font-size: 0.9rem;">Back to Login</a>
        </p>
    </div>

    <script>
        async function verifyOtp(e) {
            e.preventDefault();
            const otp = document.getElementById('otp').value;

            try {
                const res = await fetch('/verify-2fa', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ otp })
                });
                const data = await res.json();

                if (data.success) {
                    window.location.href = data.redirect;
                } else {
                    alert(data.message || 'Invalid Code');
                }
            } catch (err) {
                alert('Connection Error');
            }
        }
    </script>
</body>

</html>
