<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login - JoyHotels</title>
    <!-- Replacing old dark theme with new Lodgify theme -->
    <link rel="stylesheet" href="{{ url_for('static', filename='lodgify_theme.css') }}?v=1.1">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    
    <!-- PWA Mobile App Support -->
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="default">
    <meta name="theme-color" content="#10b981">
    <link rel="manifest" href="/manifest.json">
    <link rel="apple-touch-icon" href="{{ url_for('static', filename='icon-192.png') }}">
    
    <script>
        if ('serviceWorker' in navigator) {
            window.addEventListener('load', () => {
                navigator.serviceWorker.register('/sw.js')
                    .then(reg => console.log('Service Worker registered successfully.'))
                    .catch(err => console.log('Service Worker registration failed:', err));
            });
        }
    </script>
</head>

<body>
    <div class="auth-container">
        <div class="auth-box" style="position: relative;">
            <a href="/" style="position: absolute; top: 1rem; right: 1rem; color: var(--text-muted); text-decoration: none; font-size: 1.5rem; line-height: 1; padding: 0.5rem; border-radius: 50%; background: rgba(0,0,0,0.05); width: 40px; height: 40px; display: flex; align-items: center; justify-content: center; transition: all 0.2s;">✕</a>
            <img src="{{ url_for('static', filename='logo.png') }}" class="auth-logo" alt="Logo">
            <h2 style="color: var(--text-main); margin-bottom: 0.5rem; font-size: 2rem; font-weight: 800;">Welcome Back</h2>
            <p style="color: var(--text-muted); margin-bottom: 2.5rem; font-size: 1rem;">Sign in to your dashboard</p>

            <form id="loginForm">
                <div class="form-group">
                    <label>Username</label>
                    <input type="text" id="username" class="form-input" placeholder="Enter your username" required>
                </div>
                <div class="form-group">
                    <label>Password</label>
                    <input type="password" id="password" class="form-input" placeholder="••••••••" required>
                </div>

                <!-- Replace btn-gold with btn-primary for green theme -->
                <button type="submit" class="btn-primary btn-full" style="margin-top: 1rem;">Login to Dashboard</button>
            </form>

            <div class="auth-footer">
                Don't have an account? <a href="{{ url_for('signup') }}">Join JoyHotels</a>
            </div>

            <div id="error" style="color: #ef4444; background: #fee2e2; border: 1px solid #f87171; padding: 0.75rem; border-radius: 8px; margin-top: 1.5rem; display: none; font-size: 0.9rem; font-weight: 500;"></div>
        </div>
    </div>

    <script>
        document.getElementById('loginForm').addEventListener('submit', async function (e) {
            e.preventDefault();
            const btn = e.target.querySelector('button');
            const errorDiv = document.getElementById('error');

            btn.disabled = true;
            btn.innerText = 'Verifying...';
            errorDiv.style.display = 'none';

            const data = {
                username: document.getElementById('username').value,
                password: document.getElementById('password').value
            };

            try {
                const response = await fetch('/api/login', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify(data)
                });

                const result = await response.json();

                if (result.success) {
                    window.location.href = result.redirect || '/dashboard';
                } else {
                    errorDiv.innerText = result.message || 'Invalid credentials';
                    errorDiv.style.display = 'block';
                    btn.disabled = false;
                    btn.innerText = 'Login to Dashboard';
                }
            } catch (err) {
                errorDiv.innerText = 'Connection error. Please try again.';
                errorDiv.style.display = 'block';
                btn.disabled = false;
                btn.innerText = 'Login to Dashboard';
            }
        });
    </script>
</body>

</html>
