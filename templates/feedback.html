<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Guest Feedback - {{ hotel_name }}</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Inter', sans-serif;
            background: linear-gradient(135deg, #1e293b 0%, #0f172a 100%);
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 20px;
        }

        .feedback-card {
            background: rgba(255, 255, 255, 0.05);
            border: 1px solid #334155;
            border-radius: 20px;
            padding: 40px;
            max-width: 450px;
            width: 100%;
            text-align: center;
        }

        .hotel-name {
            color: #D4AF37;
            font-size: 1.5rem;
            font-weight: 600;
            margin-bottom: 10px;
        }

        .subtitle {
            color: #94a3b8;
            font-size: 0.9rem;
            margin-bottom: 30px;
        }

        .stars {
            display: flex;
            justify-content: center;
            gap: 10px;
            margin-bottom: 25px;
        }

        .star {
            font-size: 2.5rem;
            cursor: pointer;
            transition: all 0.2s;
            color: #475569;
        }

        .star:hover,
        .star.active {
            color: #D4AF37;
            transform: scale(1.2);
        }

        .form-group {
            margin-bottom: 20px;
            text-align: left;
        }

        .form-group label {
            display: block;
            color: #94a3b8;
            font-size: 0.85rem;
            margin-bottom: 8px;
        }

        .form-control {
            width: 100%;
            padding: 12px 15px;
            border: 1px solid #334155;
            border-radius: 10px;
            background: rgba(255, 255, 255, 0.05);
            color: #f8fafc;
            font-size: 1rem;
            transition: border-color 0.2s;
        }

        .form-control:focus {
            outline: none;
            border-color: #D4AF37;
        }

        textarea.form-control {
            min-height: 100px;
            resize: vertical;
        }

        .btn-submit {
            width: 100%;
            padding: 15px;
            background: linear-gradient(135deg, #D4AF37 0%, #B8860B 100%);
            border: none;
            border-radius: 10px;
            color: #1e293b;
            font-size: 1rem;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.3s;
        }

        .btn-submit:hover {
            transform: translateY(-2px);
            box-shadow: 0 10px 20px rgba(212, 175, 55, 0.3);
        }

        .btn-submit:disabled {
            opacity: 0.6;
            cursor: not-allowed;
        }

        .success-msg {
            display: none;
            padding: 40px;
            text-align: center;
        }

        .success-msg.show {
            display: block;
        }

        .success-icon {
            font-size: 4rem;
            margin-bottom: 20px;
        }

        .success-text {
            color: #10b981;
            font-size: 1.3rem;
            font-weight: 600;
            margin-bottom: 10px;
        }

        .success-sub {
            color: #94a3b8;
        }

        .form-content {
            display: block;
        }

        .form-content.hide {
            display: none;
        }
    </style>
</head>

<body>
    <div class="feedback-card">
        <div class="form-content" id="formContent">
            <div class="hotel-name">{{ hotel_name }}</div>
            <div class="subtitle">We value your feedback! ⭐</div>

            <div class="stars" id="starRating">
                <span class="star" data-value="1">★</span>
                <span class="star" data-value="2">★</span>
                <span class="star" data-value="3">★</span>
                <span class="star" data-value="4">★</span>
                <span class="star" data-value="5">★</span>
            </div>

            <div class="form-group">
                <label>Your Name (optional)</label>
                <input type="text" id="guestName" class="form-control" placeholder="John Doe">
            </div>

            <div class="form-group">
                <label>Your Feedback</label>
                <textarea id="comment" class="form-control" placeholder="Tell us about your experience..."></textarea>
            </div>

            <button class="btn-submit" id="submitBtn" onclick="submitFeedback()">Submit Feedback</button>
        </div>

        <div class="success-msg" id="successMsg">
            <div class="success-icon">🎉</div>
            <div class="success-text">Thank You!</div>
            <div class="success-sub">Your feedback has been submitted successfully.</div>
        </div>
    </div>

    <script>
        let selectedRating = 5;

        // Star rating logic
        document.querySelectorAll('.star').forEach(star => {
            star.addEventListener('click', function () {
                selectedRating = parseInt(this.dataset.value);
                updateStars();
            });
            star.addEventListener('mouseenter', function () {
                highlightStars(parseInt(this.dataset.value));
            });
        });

        document.getElementById('starRating').addEventListener('mouseleave', updateStars);

        function highlightStars(count) {
            document.querySelectorAll('.star').forEach((s, i) => {
                s.classList.toggle('active', i < count);
            });
        }

        function updateStars() {
            highlightStars(selectedRating);
        }
        updateStars();

        async function submitFeedback() {
            const btn = document.getElementById('submitBtn');
            btn.disabled = true;
            btn.innerText = 'Submitting...';

            try {
                const res = await fetch('/feedback/{{ hotel_id }}/submit', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({
                        rating: selectedRating,
                        name: document.getElementById('guestName').value || 'Anonymous',
                        comment: document.getElementById('comment').value
                    })
                });
                const data = await res.json();

                if (data.success) {
                    document.getElementById('formContent').classList.add('hide');
                    document.getElementById('successMsg').classList.add('show');
                } else {
                    alert('Error submitting feedback');
                    btn.disabled = false;
                    btn.innerText = 'Submit Feedback';
                }
            } catch (e) {
                alert('Connection error');
                btn.disabled = false;
                btn.innerText = 'Submit Feedback';
            }
        }
    </script>
</body>

</html>
