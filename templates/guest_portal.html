<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Guest Portal - JoyHotels</title>
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <style>
        :root {
            --primary: #d4af37;
            --bg: #0f172a;
            --card: #1e293b;
            --text: #f8fafc;
        }

        body {
            font-family: 'Outfit', sans-serif;
            background: var(--bg);
            color: var(--text);
            margin: 0;
            padding: 20px;
        }

        .container {
            max-width: 600px;
            margin: 0 auto;
        }

        .header {
            text-align: center;
            margin-bottom: 2rem;
        }

        .card {
            background: var(--card);
            padding: 1.5rem;
            border-radius: 16px;
            margin-bottom: 1rem;
            box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.3);
            border: 1px solid rgba(255, 255, 255, 0.05);
        }

        .btn {
            background: var(--primary);
            color: #000;
            border: none;
            padding: 12px 20px;
            border-radius: 8px;
            font-weight: 600;
            width: 100%;
            cursor: pointer;
            margin-top: 10px;
            font-size: 1rem;
        }

        .btn-outline {
            background: transparent;
            border: 1px solid var(--primary);
            color: var(--primary);
        }

        .grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 10px;
        }

        h2 {
            margin-top: 0;
            font-size: 1.25rem;
        }

        .welcome {
            color: #94a3b8;
            font-size: 0.9rem;
        }

        .room-badge {
            background: rgba(212, 175, 55, 0.2);
            color: var(--primary);
            padding: 5px 10px;
            border-radius: 20px;
            font-size: 0.8rem;
            display: inline-block;
            margin-bottom: 10px;
        }
    </style>
</head>

<body>
    <div class="container">
        <!-- Main View -->
        <div id="mainView">
            <div class="header">
                <div style="font-size: 2rem;">🛎️</div>
                <h1>Guest Portal</h1>
                <p class="welcome">Welcome, {{ booking.guest_name }}</p>
                <div class="room-badge">Room {{ booking.room }}</div>
                <button class="btn" onclick="toggleEditView()" style="margin-top: 1rem;">✏️ Edit Details</button>
            </div>

            <div class="card">
                <h2>⚡ Quick Requests</h2>
                <div class="grid">
                    <button class="btn btn-outline" onclick="requestService('cleaning')">🧹 Clean Room</button>
                    <button class="btn btn-outline" onclick="requestService('water')">💧 Water</button>
                    <button class="btn btn-outline" onclick="requestService('towels')">🧴 Towels</button>
                    <button class="btn btn-outline" onclick="requestService('dnd')">⛔ Do Not Disturb</button>
                </div>
            </div>
        

        <div class="card">
            <h2>🧾 Your Bill (Estimated)</h2>
            <p style="font-size: 2rem; font-weight: 700; margin: 10px 0;">
                {{ booking.currency }}<span id="liveTotal">...</span>
            </p>
            <button class="btn" onclick="window.location.href='/bill/{{ booking.id }}'">View Full Bill</button>
        </div>

        <div class="card">
            <h2>📞 Front Desk</h2>
            <button class="btn" onclick="window.location.href='tel:911'">Call Reception</button>
        </div>
        </div>

        <!-- Edit View -->
        <div id="editView" style="display: none;">
            <div class="header">
                <div style="font-size: 2rem;">✏️</div>
                <h1>Edit Your Details</h1>
                <button class="btn" onclick="toggleEditView()" style="margin-top: 1rem; background: #94a3b8;">← Back</button>
            </div>

            <form id="editForm" enctype="multipart/form-data">
                <!-- Guest Name -->
                <div class="card">
                    <label style="display: block; margin-bottom: 0.5rem; font-weight: 600;">Guest Name</label>
                    <input type="text" id="guestName" placeholder="Full Name" style="width: 100%; padding: 10px; border-radius: 8px; border: 1px solid #444; background: #0f172a; color: #f8fafc; margin-bottom: 1rem; box-sizing: border-box;">
                    
                    <label style="display: block; margin-bottom: 0.5rem; font-weight: 600;">Second Guest Name (Optional)</label>
                    <input type="text" id="secondGuestName" placeholder="Second Guest Name" style="width: 100%; padding: 10px; border-radius: 8px; border: 1px solid #444; background: #0f172a; color: #f8fafc; margin-bottom: 1rem; box-sizing: border-box;">
                </div>

                <!-- Phone & Address -->
                <div class="card">
                    <label style="display: block; margin-bottom: 0.5rem; font-weight: 600;">Phone Number</label>
                    <input type="tel" id="phone" placeholder="Phone Number" pattern="[0-9]{10}" style="width: 100%; padding: 10px; border-radius: 8px; border: 1px solid #444; background: #0f172a; color: #f8fafc; margin-bottom: 1rem; box-sizing: border-box;">
                    
                    <label style="display: block; margin-bottom: 0.5rem; font-weight: 600;">Address</label>
                    <input type="text" id="address" placeholder="Address" style="width: 100%; padding: 10px; border-radius: 8px; border: 1px solid #444; background: #0f172a; color: #f8fafc; margin-bottom: 1rem; box-sizing: border-box;">
                </div>

                <!-- ID Details -->
                <div class="card">
                    <label style="display: block; margin-bottom: 0.5rem; font-weight: 600;">ID Number</label>
                    <input type="text" id="idNumber" placeholder="ID Number" style="width: 100%; padding: 10px; border-radius: 8px; border: 1px solid #444; background: #0f172a; color: #f8fafc; margin-bottom: 1rem; box-sizing: border-box;">
                    
                    <label style="display: block; margin-bottom: 0.5rem; font-weight: 600;">ID Photo</label>
                    <input type="file" id="idPhoto" accept="image/*" style="width: 100%; padding: 10px; border-radius: 8px; border: 1px solid #444; background: #0f172a; color: #f8fafc; margin-bottom: 1rem; box-sizing: border-box;">
                </div>

                <!-- Room Number -->
                <div class="card">
                    <label style="display: block; margin-bottom: 0.5rem; font-weight: 600;">Room Number</label>
                    <input type="text" id="roomNumber" placeholder="Room Number" style="width: 100%; padding: 10px; border-radius: 8px; border: 1px solid #444; background: #0f172a; color: #f8fafc; margin-bottom: 1rem; box-sizing: border-box;">
                </div>

                <!-- Submit -->
                <div class="card">
                    <button type="submit" class="btn" style="background: #10b981;">💾 Save Changes</button>
                </div>
            </form>
        </div>
    </div>

    <script>
        const bookingId = {{ booking.id }};

        // Toggle between main view and edit view
        function toggleEditView() {
            const mainView = document.getElementById('mainView');
            const editView = document.getElementById('editView');
            mainView.style.display = mainView.style.display === 'none' ? 'block' : 'none';
            editView.style.display = editView.style.display === 'none' ? 'block' : 'none';
            
            if (editView.style.display === 'block') {
                loadCurrentDetails();
            }
        }

        // Load current booking details into the edit form
        async function loadCurrentDetails() {
            try {
                const res = await fetch(`/api/guest/edit-details/${bookingId}`);
                const data = await res.json();
                
                document.getElementById('guestName').value = data.guest_name || '';
                document.getElementById('secondGuestName').value = data.second_guest_name || '';
                document.getElementById('phone').value = data.phone || '';
                document.getElementById('address').value = data.address || '';
                document.getElementById('idNumber').value = data.id_number || '';
                document.getElementById('roomNumber').value = data.room || '';
            } catch (e) {
                console.error('Error loading details:', e);
            }
        }

        // Handle form submission for edit
        document.getElementById('editForm').addEventListener('submit', async (e) => {
            e.preventDefault();
            
            const formData = new FormData();
            formData.append('booking_id', bookingId);
            formData.append('guest_name', document.getElementById('guestName').value);
            formData.append('second_guest_name', document.getElementById('secondGuestName').value);
            formData.append('phone', document.getElementById('phone').value);
            formData.append('address', document.getElementById('address').value);
            formData.append('id_number', document.getElementById('idNumber').value);
            formData.append('room', document.getElementById('roomNumber').value);
            
            const idPhotoFile = document.getElementById('idPhoto').files[0];
            if (idPhotoFile) {
                formData.append('id_photo', idPhotoFile);
            }
            
            try {
                const res = await fetch('/api/guest/update-details', {
                    method: 'POST',
                    body: formData
                });
                const data = await res.json();
                
                if (data.success) {
                    alert('Details updated successfully!');
                    location.reload();
                } else {
                    alert('Error: ' + (data.message || 'Failed to update'));
                }
            } catch (e) {
                alert('Error updating details: ' + e.message);
            }
        });

        async function requestService(type) {
            if (!confirm(`Request ${type}?`)) return;

            try {
                const res = await fetch('/api/guest/request', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ booking_id: bookingId, type })
                });
                const data = await res.json();
                if (data.success) alert('Request Sent! Staff will be there shortly.');
                else alert('Error sending request');
            } catch (e) {
                alert('Connection error');
            }
        }
    </script>
</body>

</html>
