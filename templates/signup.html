<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sign Up - JoyHotels</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='lodgify_theme.css') }}?v=1.1">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <style>
        /* Override auth-box to be slightly wider for signup form */
        .auth-box {
            max-width: 480px;
            width: 90%;
        }

        /* Light-themed modal */
        .joy-modal-overlay {
            position: fixed;
            top: 0; left: 0; right: 0; bottom: 0;
            background: rgba(244, 247, 244, 0.7);
            backdrop-filter: blur(8px);
            display: none;
            align-items: center;
            justify-content: center;
            z-index: 9999;
            padding: 20px;
        }

        .joy-modal {
            background: var(--bg-card);
            border: 1px solid var(--border-color);
            border-radius: 20px;
            padding: 3rem 2.5rem;
            max-width: 420px;
            width: 100%;
            text-align: center;
            box-shadow: 0 25px 50px rgba(0, 0, 0, 0.06);
            animation: modalScale 0.3s cubic-bezier(0.34, 1.56, 0.64, 1);
        }

        @keyframes modalScale {
            from { transform: scale(0.85); opacity: 0; }
            to   { transform: scale(1);    opacity: 1; }
        }

        .joy-modal .modal-icon {
            font-size: 3rem;
            margin-bottom: 1rem;
        }

        .joy-modal h3 {
            color: var(--text-main);
            margin-top: 0;
            font-size: 1.6rem;
            font-weight: 800;
        }

        .joy-modal p {
            color: var(--text-muted);
            line-height: 1.7;
            margin: 1rem 0 2rem;
        }

        .btn-modal {
            background: var(--brand-primary);
            color: #ffffff;
            font-weight: 700;
            border: none;
            padding: 0.85rem 2.5rem;
            border-radius: 8px;
            cursor: pointer;
            font-size: 1rem;
            font-family: inherit;
            transition: all 0.3s ease;
            box-shadow: 0 4px 12px rgba(163, 209, 51, 0.3);
        }

        .btn-modal:hover {
            background: var(--brand-primary-hover);
            transform: translateY(-2px);
        }
    </style>
</head>

<body>
    <div class="auth-container">
        <div class="auth-box" style="position: relative;">
            <a href="/" style="position: absolute; top: 1rem; right: 1rem; color: var(--text-muted); text-decoration: none; font-size: 1.5rem; line-height: 1; padding: 0.5rem; border-radius: 50%; background: rgba(0,0,0,0.05); width: 40px; height: 40px; display: flex; align-items: center; justify-content: center; transition: all 0.2s;">✕</a>
            <img src="{{ url_for('static', filename='logo.png') }}" class="auth-logo" alt="Logo">
            <h2 style="color: var(--text-main); margin-bottom: 0.5rem; font-size: 2rem; font-weight: 800;">Create Your Account</h2>
            <p style="color: var(--text-muted); margin-bottom: 2rem; font-size: 1rem;">Set up your hotel on JoyHotels</p>

            <form id="signupForm">
                <div class="form-group">
                    <label>Hotel Name</label>
                    <input type="text" id="hotel_name" class="form-input" required placeholder="Grand Luxury Hotel">
                </div>
                <div class="form-group">
                    <label>Business Email</label>
                    <input type="email" id="email" class="form-input" required placeholder="owner@hotel.com">
                </div>
                <div class="form-group">
                    <label>Phone Number</label>
                    <input type="tel" id="phone" class="form-input" required placeholder="+91 98765 43210">
                </div>
                <div class="form-group">
                    <label>Admin Username</label>
                    <input type="text" id="username" class="form-input" required placeholder="Choose a username">
                </div>
                <div class="form-group">
                    <label>Admin Password</label>
                    <input type="password" id="password" class="form-input" required placeholder="Create a strong password">
                </div>

                <input type="hidden" id="plan">
                <input type="hidden" id="utr_ref">

                <button type="submit" class="btn-primary btn-full" style="margin-top: 1rem;">Complete Registration</button>
            </form>

            <div class="auth-footer">
                Already have an account? <a href="{{ url_for('login') }}">Login</a>
            </div>
        </div>
    </div>

    <!-- Light-themed Modal -->
    <div id="joyAlertModal" class="joy-modal-overlay">
        <div class="joy-modal">
            <div class="modal-icon" id="modalIcon">✅</div>
            <h3 id="modalTitle">Notification</h3>
            <p id="modalMessage">Message goes here.</p>
            <button onclick="closeJoyAlert()" class="btn-modal">Got it!</button>
        </div>
    </div>

    <script>
        function showJoyAlert(title, message, redirectUrl = null, icon = '💬') {
            document.getElementById('modalIcon').innerText = icon;
            document.getElementById('modalTitle').innerText = title;
            document.getElementById('modalMessage').innerText = message;
            document.getElementById('joyAlertModal').style.display = 'flex';
            window.pendingRedirect = redirectUrl;
        }

        function closeJoyAlert() {
            document.getElementById('joyAlertModal').style.display = 'none';
            if (window.pendingRedirect) {
                window.location.href = window.pendingRedirect;
            }
        }

        const pendingUTR = sessionStorage.getItem('pending_utr');
        const pendingPlan = sessionStorage.getItem('pending_plan');

        if (!pendingUTR) {
            showJoyAlert('Payment Needed', 'Please select a plan and make a payment first.', '/pricing', '💳');
        } else {
            document.getElementById('utr_ref').value = pendingUTR;
            document.getElementById('plan').value = pendingPlan;
        }

        document.getElementById('signupForm').addEventListener('submit', async function (e) {
            e.preventDefault();

            const btn = e.target.querySelector('button');
            const originalText = btn.innerText;
            btn.innerText = 'Registering Hotel...';
            btn.disabled = true;

            const data = {
                hotel_name: document.getElementById('hotel_name').value,
                email: document.getElementById('email').value,
                phone: document.getElementById('phone').value,
                username: document.getElementById('username').value,
                password: document.getElementById('password').value,
                plan: document.getElementById('plan').value,
                utr_ref: document.getElementById('utr_ref').value
            };

            try {
                const response = await fetch('/api/register', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify(data)
                });

                const result = await response.json();

                if (result.success) {
                    sessionStorage.removeItem('pending_utr');
                    sessionStorage.removeItem('pending_plan');
                    showJoyAlert('Registration Successful! 🎉', 'Your account is pending verification. You\'ll receive confirmation via email once activated.', '/login', '✅');
                } else {
                    showJoyAlert('Registration Error', result.message || 'Something went wrong.', null, '⚠️');
                    btn.innerText = originalText;
                    btn.disabled = false;
                }
            } catch (err) {
                console.error(err);
                showJoyAlert('Network Error', 'Could not connect to the server. Please try again.', null, '❌');
                btn.innerText = originalText;
                btn.disabled = false;
            }
        });
    </script>
</body>

</html>
