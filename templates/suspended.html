<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Account Suspended - JoyHotels</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;700&display=swap" rel="stylesheet">
    <style>
        :root {
            --danger-red: #ef4444;
            --gold: #D4AF37;
            --bg-dark: #0f172a;
        }

        body {
            background-color: var(--bg-dark);
            color: white;
            font-family: 'Inter', sans-serif;
            display: flex;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
            margin: 0;
            overflow: hidden;
        }

        .suspended-container {
            text-align: center;
            max-width: 500px;
            padding: 3rem;
            background: rgba(30, 41, 59, 0.7);
            backdrop-filter: blur(12px);
            border: 1px solid rgba(239, 68, 68, 0.3);
            border-radius: 24px;
            box-shadow: 0 25px 50px -12px rgba(0, 0, 0, 0.5);
            animation: fadeIn 0.6s ease-out;
        }

        @keyframes fadeIn {
            from {
                opacity: 0;
                transform: translateY(20px);
            }

            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        .icon-box {
            width: 80px;
            height: 80px;
            background: rgba(239, 68, 68, 0.1);
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            margin: 0 auto 2rem;
            color: var(--danger-red);
            font-size: 2.5rem;
        }

        h1 {
            color: white;
            font-size: 2rem;
            margin-bottom: 1rem;
            font-weight: 700;
        }

        p {
            color: #94a3b8;
            line-height: 1.6;
            margin-bottom: 2rem;
        }

        .contact-info {
            background: rgba(212, 175, 55, 0.05);
            border: 1px solid rgba(212, 175, 55, 0.1);
            padding: 1rem;
            border-radius: 12px;
            margin-bottom: 2rem;
        }

        .contact-info a {
            color: var(--gold);
            text-decoration: none;
            font-weight: 600;
        }

        .btn-logout {
            background: transparent;
            border: 1px solid #334155;
            color: white;
            padding: 0.75rem 1.5rem;
            border-radius: 8px;
            cursor: pointer;
            transition: all 0.3s ease;
            text-decoration: none;
            display: inline-block;
        }

        .btn-logout:hover {
            background: #334155;
        }
    </style>
</head>

<body>
    <div class="suspended-container">
        <div class="icon-box">🚫</div>
        <h1>Account Suspended</h1>
        <p>It looks like your access to JoyHotels has been temporarily restricted. Your data is safe and secured, but
            you cannot access the dashboard right now.</p>

        <div class="contact-info">
            <small style="display: block; margin-bottom: 0.5rem; color: #64748b;">To reactivate your membership,
                contact:</small>
            <div style="font-weight: 600; color: var(--gold); margin-bottom: 0.5rem;">📞 +91 8956364864</div>
            <a href="mailto:joyhotels500@gmail.com">📧 joyhotels500@gmail.com</a>
        </div>

        <a href="/logout" class="btn-logout">Return to Home</a>
    </div>
</body>

</html>
