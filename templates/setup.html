<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Hotel Setup - JoyHotels</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
    <style>
        .auth-box {
            max-width: 600px;
        }

        .steps {
            display: flex;
            gap: 1rem;
            margin-bottom: 2rem;
            justify-content: center;
        }

        .step {
            width: 10px;
            height: 10px;
            border-radius: 50%;
            background: #374151;
        }

        .step.active {
            background: var(--gold);
        }
    </style>
</head>

<body>
    <div class="auth-container">
        <div class="auth-box">
            <h2 style="color: white; margin-bottom: 1rem;">Setup Your Hotel Team</h2>
            <p style="color: #9ca3af; margin-bottom: 2rem;">Create a separate login for your reception staff.</p>

            <form id="setupForm">
                <div class="form-group">
                    <label style="color: var(--gold);">Staff Username</label>
                    <input type="text" id="staffUsername" class="form-input" placeholder="e.g. reception" required>
                </div>
                <div class="form-group">
                    <label style="color: var(--gold);">Staff Password</label>
                    <input type="password" id="staffPassword" class="form-input" required>
                </div>

                <button type="submit" class="btn-gold btn-full">Create Staff Account & Finish</button>
            </form>

            <div style="margin-top: 1rem; text-align: center;">
                <a href="/dashboard" style="color: #6b7280; font-size: 0.9rem;">Skip for now</a>
            </div>
        </div>
    </div>

    <script>
        document.getElementById('setupForm').addEventListener('submit', async function (e) {
            e.preventDefault();
            const btn = e.target.querySelector('button');
            btn.disabled = true;
            btn.innerText = 'Creating...';

            const data = {
                username: document.getElementById('staffUsername').value,
                password: document.getElementById('staffPassword').value
            };

            try {
                const response = await fetch('/api/setup/staff', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify(data)
                });

                const result = await response.json();
                if (result.success) {
                    alert('Staff account created! Redirecting to dashboard...');
                    window.location.href = '/dashboard';
                } else {
                    alert(result.message);
                    btn.disabled = false;
                    btn.innerText = 'Create Staff Account';
                }
            } catch (err) {
                alert('Connection error');
                btn.disabled = false;
            }
        });
    </script>
</body>

</html>
