<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Reservations Calendar - JoyHotels</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;700&display=swap" rel="stylesheet">
    <script src="https://cdn.jsdelivr.net/npm/fullcalendar@6.1.8/index.global.min.js"></script>
    <style>
        :root {
            --bg-body: #0b0f19;
            --bg-card: #151c2c;
            --bg-modal: #182032;
            --text-primary: #f8fafc;
            --text-secondary: #94a3b8;
            --primary-color: #d4af37;
            --primary-hover: #b8860b;
            --accent-green: #10b981;
            --accent-amber: #d97706;
            --accent-red: #ef4444;
            --border-color: rgba(255, 255, 255, 0.08);
            --border-gold: rgba(212, 175, 55, 0.25);
        }

        body {
            font-family: 'Inter', system-ui, -apple-system, sans-serif;
            background-color: var(--bg-body);
            color: var(--text-primary);
            margin: 0;
            height: 100vh;
            overflow: hidden;
        }

        /* Header */
        .top-header {
            background: var(--bg-card);
            border-bottom: 1px solid var(--border-color);
            box-shadow: 0 4px 20px rgba(0, 0, 0, 0.4);
        }

        .nav-btn {
            background: transparent;
            border: none;
            color: var(--text-secondary);
            padding: 8px 16px;
            border-radius: 10px;
            cursor: pointer;
            font-weight: 600;
            transition: all 0.2s;
            text-decoration: none;
            font-size: 0.9rem;
        }

        .nav-btn:hover,
        .nav-btn.active {
            background: rgba(212, 175, 55, 0.12);
            color: var(--primary-color);
        }

        .control-bar {
            background: var(--bg-card);
            border: 1px solid var(--border-color);
            border-radius: 16px;
            padding: 1rem 1.5rem;
            margin-bottom: 1.5rem;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        /* Modal Dialog matching user reference */
        .modal {
            display: none;
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0, 0, 0, 0.75);
            z-index: 1000;
            align-items: center;
            justify-content: center;
            backdrop-filter: blur(8px);
        }

        .modal.show {
            display: flex;
        }

        .modal-content {
            background: var(--bg-modal);
            padding: 2.25rem;
            border-radius: 20px;
            width: 480px;
            border: 1px solid rgba(212, 175, 55, 0.2);
            box-shadow: 0 25px 50px -12px rgba(0, 0, 0, 0.7);
        }

        .modal-header h2 {
            margin: 0 0 4px 0;
            font-size: 1.6rem;
            font-weight: 800;
            color: #ffffff;
            letter-spacing: -0.3px;
        }

        .modal-header p {
            margin: 0;
            font-size: 0.85rem;
            color: var(--text-secondary);
        }

        .form-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 1.25rem;
        }

        .form-group {
            margin-bottom: 1.25rem;
        }

        .form-group label {
            display: block;
            margin-bottom: 0.5rem;
            color: #94a3b8;
            font-size: 0.75rem;
            font-weight: 800;
            letter-spacing: 0.8px;
            text-transform: uppercase;
        }

        .form-control {
            width: 100%;
            padding: 12px 14px;
            background: rgba(15, 23, 42, 0.7);
            border: 1px solid rgba(255, 255, 255, 0.12);
            border-radius: 12px;
            color: #f8fafc;
            font-size: 0.95rem;
            box-sizing: border-box;
            font-family: inherit;
            transition: all 0.2s;
        }

        .form-control:focus {
            outline: none;
            border-color: var(--primary-color);
            box-shadow: 0 0 0 3px rgba(212, 175, 55, 0.15);
        }

        /* Save Booking Button matching user screenshot */
        .btn-gold-submit {
            background: linear-gradient(135deg, #d4af37, #b8860b);
            color: #0f172a;
            font-weight: 800;
            padding: 12px 24px;
            border-radius: 9999px;
            border: none;
            cursor: pointer;
            font-size: 0.95rem;
            transition: all 0.2s;
            box-shadow: 0 4px 15px rgba(212, 175, 55, 0.3);
        }

        .btn-gold-submit:hover {
            background: linear-gradient(135deg, #f3e5ab, #d4af37);
            transform: translateY(-1px);
        }

        .btn-cancel {
            background: rgba(255, 255, 255, 0.05);
            color: #cbd5e1;
            font-weight: 600;
            padding: 12px 24px;
            border-radius: 9999px;
            border: 1px solid rgba(255, 255, 255, 0.15);
            cursor: pointer;
            font-size: 0.95rem;
            transition: all 0.2s;
        }

        .btn-cancel:hover {
            background: rgba(255, 255, 255, 0.1);
            color: #ffffff;
        }

        .modal-header h2 {
            margin: 0;
            font-size: 1.5rem;
        }

        .close-btn {
            background: none;
            border: none;
            color: var(--text-secondary);
            font-size: 1.5rem;
            cursor: pointer;
        }

        .form-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 1rem;
        }

        .form-group {
            margin-bottom: 1.25rem;
        }

        .form-group label {
            display: block;
            margin-bottom: 0.5rem;
            color: var(--text-secondary);
            font-size: 0.9rem;
        }

        .form-control {
            width: 100%;
            padding: 10px;
            background: rgba(255, 255, 255, 0.05);
            border: 1px solid var(--border-color);
            border-radius: 6px;
            color: white;
            box-sizing: border-box;
        }

        .form-control:focus {
            outline: none;
            border-color: var(--primary-color);
        }

        .modal-actions {
            display: flex;
            gap: 1rem;
            margin-top: 1rem;
        }

        .modal-actions .btn {
            flex: 1;
        }

        /* Toggle */
        .toggle-option {
            display: flex;
            align-items: center;
            cursor: pointer;
            gap: 10px;
        }

        .toggle-option input {
            display: none;
        }

        .toggle-slider {
            width: 36px;
            height: 20px;
            background: var(--border-color);
            border-radius: 20px;
            position: relative;
            transition: 0.3s;
        }

        .toggle-slider:before {
            content: "";
            position: absolute;
            width: 16px;
            height: 16px;
            background: white;
            border-radius: 50%;
            top: 2px;
            left: 2px;
            transition: 0.3s;
        }

        input:checked+.toggle-slider {
            background: var(--primary-color);
        }

        input:checked+.toggle-slider:before {
            transform: translateX(16px);
        }

        .toggle-label {
            font-size: 0.9rem;
            color: var(--text-secondary);
        }
    </style>
</head>

<body data-theme="dark">
    <!-- Top Header (Standard Component) -->
    <div class="top-header"
        style="background: var(--bg-card); border-bottom: 1px solid var(--border-color); padding: 0.75rem 2rem; display: flex; justify-content: space-between; align-items: center; position: sticky; top: 0; z-index: 100;">
        <div style="display: flex; align-items: center; gap: 2rem;">
            <div class="logo">
                <a href="/dashboard"
                    style="text-decoration: none; display: flex; align-items: center; gap: 10px; color: var(--text-primary); font-weight: 700; font-size: 1.2rem;">
                    <span>📅 JoyHotels</span>
                </a>
            </div>
            <div class="header-nav" style="display: flex; gap: 0.5rem;">
                <button class="nav-btn" onclick="window.location.href='/dashboard'">Dashboard</button>
                {% if role in ['owner', 'admin'] %}
                <button class="nav-btn" onclick="window.location.href='/dashboard#financial'">Financials</button>
                {% endif %}
                <button class="nav-btn active">Calendar</button>
                {% if role in ['owner', 'admin'] %}
                <button class="nav-btn" onclick="window.location.href='/settings'">Settings</button>
                {% endif %}
            </div>
        </div>
        <div class="header-right" style="display: flex; align-items: center; gap: 1rem;">
            <span>👤 {{ session.username|title }}</span>
            <button class="btn btn-outline" onclick="window.location.href='/logout'"
                style="padding: 6px 12px; font-size: 0.85rem;">Logout</button>
        </div>
    </div>

    <!-- Main Container -->
    <div class="main-container"
        style="padding: 2rem; display: flex; flex-direction: column; height: calc(100vh - 70px);">

        <!-- Control Bar -->
        <div class="control-bar"
            style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 1.5rem; background: var(--bg-card); padding: 1.25rem 1.75rem; border-radius: 18px; border: 1px solid rgba(255,255,255,0.08);">
            <div style="display: flex; align-items: center; gap: 2rem;">
                <div style="font-size: 1.2rem; font-weight: 800; color: #ffffff; display: flex; align-items: center; gap: 10px;">
                    <span style="width: 32px; height: 32px; background: rgba(212, 175, 55, 0.15); border: 1px solid var(--primary-color); border-radius: 8px; display: inline-flex; align-items: center; justify-content: center; color: var(--primary-color); font-size: 0.9rem;">R</span>
                    The Registry <span style="font-size: 0.75rem; font-weight: 600; color: var(--text-secondary); text-transform: uppercase; letter-spacing: 1px; background: rgba(255,255,255,0.05); padding: 4px 8px; border-radius: 6px;">Reservations Board</span>
                </div>
                
                <!-- Status Legend Pills -->
                <div style="display: flex; gap: 1.25rem; align-items: center; border-left: 1px solid rgba(255,255,255,0.1); padding-left: 1.5rem;">
                    <div style="display: flex; align-items: center; gap: 6px; font-size: 0.85rem; color: #cbd5e1; font-weight: 500;">
                        <span style="width: 8px; height: 8px; border-radius: 50%; background: #d97706;"></span> Confirmed
                    </div>
                    <div style="display: flex; align-items: center; gap: 6px; font-size: 0.85rem; color: #cbd5e1; font-weight: 500;">
                        <span style="width: 8px; height: 8px; border-radius: 50%; background: #10b981;"></span> Checked in
                    </div>
                    <div style="display: flex; align-items: center; gap: 6px; font-size: 0.85rem; color: #cbd5e1; font-weight: 500;">
                        <span style="width: 8px; height: 8px; border-radius: 50%; background: #e11d48;"></span> Pending
                    </div>
                    <div style="display: flex; align-items: center; gap: 6px; font-size: 0.85rem; color: #cbd5e1; font-weight: 500;">
                        <span style="width: 8px; height: 8px; border-radius: 50%; background: #64748b;"></span> Blocked / maintenance
                    </div>
                </div>
            </div>

            <div style="display: flex; gap: 1.25rem; align-items: center;">
                <label class="toggle-option" style="margin:0;">
                    <input type="checkbox" id="showHistory" onchange="toggleHistory(this)">
                    <span class="toggle-slider"></span>
                    <span class="toggle-label" style="font-weight: 500; font-size: 0.9rem;">Show History</span>
                </label>
                <button class="btn-gold-submit" style="padding: 10px 22px; font-size: 0.9rem;"
                    onclick="document.getElementById('reservationModal').classList.add('show')">
                    + New booking
                </button>
            </div>
        </div>

        <!-- Calendar Area -->
        <div id="calendar-wrapper" style="flex: 1; min-height: 0;">
            <div id="calendar"></div>
        </div>
    </div>

    <!-- New Reservation Modal -->
    <div id="reservationModal" class="modal">
        <div class="modal-content">
            <div class="modal-header" style="margin-bottom: 1.5rem;">
                <div>
                    <h2>New booking</h2>
                    <p>Add a reservation to the board</p>
                </div>
                <button type="button" class="close-btn"
                    onclick="document.getElementById('reservationModal').classList.remove('show')">&times;</button>
            </div>
            <form id="resForm">
                <div class="form-group">
                    <label>ROOM</label>
                    <select name="room_id" id="roomSelect" class="form-control" required>
                        <!-- Loaded dynamically -->
                    </select>
                </div>

                <div class="form-group">
                    <label>GUEST NAME</label>
                    <input type="text" name="guest_name" class="form-control" required placeholder="e.g. Dolma Bhutia">
                </div>

                <div class="form-grid">
                    <div class="form-group">
                        <label>CHECK-IN</label>
                        <input type="date" name="checkin_date" id="checkinDate" class="form-control" required>
                    </div>
                    <div class="form-group">
                        <label>CHECK-OUT</label>
                        <input type="date" name="checkout_date" id="checkoutDate" class="form-control" required>
                    </div>
                </div>

                <div class="form-grid">
                    <div class="form-group">
                        <label>GUESTS</label>
                        <input type="number" name="guests_count" class="form-control" value="2" min="1">
                    </div>
                    <div class="form-group">
                        <label>STATUS</label>
                        <select name="status" class="form-control">
                            <option value="confirmed" selected>Confirmed</option>
                            <option value="checked_in">Checked in</option>
                            <option value="pending">Pending</option>
                            <option value="blocked">Blocked / maintenance</option>
                        </select>
                    </div>
                </div>

                <div class="form-group">
                    <label>PHONE</label>
                    <input type="tel" name="phone" class="form-control" placeholder="Optional">
                </div>

                <div style="display: flex; justify-content: flex-end; gap: 12px; margin-top: 1.5rem;">
                    <button type="button" class="btn-cancel"
                        onclick="document.getElementById('reservationModal').classList.remove('show')">Cancel</button>
                    <button type="submit" class="btn-gold-submit">Save booking</button>
                </div>
            </form>
        </div>
    </div>

    <script>
        document.addEventListener('DOMContentLoaded', function () {
            var calendarEl = document.getElementById('calendar');
            var calendar = new FullCalendar.Calendar(calendarEl, {
                initialView: 'dayGridMonth',
                height: '100%', // Fills the wrapper
                headerToolbar: {
                    left: 'prev,next today',
                    center: 'title',
                    right: 'dayGridMonth,dayGridWeek,listMonth'
                },
                selectable: true,
                dayMaxEvents: true, // +more link when too many events
                views: {
                    dayGrid: {
                        dayMaxEvents: 3 // adjust to 3 for cleaner look
                    }
                },
                select: function (info) {
                    document.getElementById('reservationModal').classList.add('show');
                    document.getElementById('checkinDate').value = info.startStr;
                    // FullCalendar selects exclusive end date, so for single day click it might be next day
                    // If multiple days selected, keep as is.
                    // Simple logic:
                    let endDate = new Date(info.endStr);
                    endDate.setDate(endDate.getDate() - 1); // Subtract 1 day for intuitive inclusive end date in form
                    document.getElementById('checkoutDate').value = endDate.toISOString().split('T')[0];
                    if (document.getElementById('checkoutDate').value < document.getElementById('checkinDate').value) {
                        document.getElementById('checkoutDate').value = info.endStr; // Fallback
                    }
                },
                events: '/api/reservations',
                eventClick: function (info) {
                    if (info.event.extendedProps.status === 'cancelled') return;
                    alert(`Reservation Details:\nGuest: ${info.event.title}\nDates: ${info.event.start.toLocaleDateString()} - ${info.event.end ? info.event.end.toLocaleDateString() : 'N/A'}`);
                },
                eventContent: function (arg) {
                    let italic = arg.event.extendedProps.status === 'cancelled' ? 'font-style:italic;' : '';
                    return { html: `<div style="font-size:0.85rem; padding:2px; ${italic}"><b>${arg.event.extendedProps.resourceId}</b>: ${arg.event.title}</div>` }
                }
            });

            calendar.render();
            window.calendarRef = calendar;

            // Load Rooms
            fetch('/api/rooms').then(r => r.json()).then(rooms => {
                const sel = document.getElementById('roomSelect');
                sel.innerHTML = '';
                rooms.forEach(room => {
                    sel.innerHTML += `<option value="${room.room_id}">${room.room_id} (${room.room_type})</option>`;
                });
            });

            // Form Submit
            document.getElementById('resForm').onsubmit = async (e) => {
                e.preventDefault();
                const formData = new FormData(e.target);
                const data = Object.fromEntries(formData.entries());

                // For date input usage, we might need to adjust back to what backend expects (exclusive end?)
                // Usually backend expects inclusive or exclusive. My backend code uses these directly.
                // If I subtracted a day for display, I might need to add it back if backend treats end as exclusive.
                // Let's assume backend logic: "date(checkout) >= ?" check matches inclusive.
                // Standard: checkin 1st, checkout 2nd = 1 night.

                try {
                    const res = await fetch('/api/reserve', {
                        method: 'POST',
                        headers: { 'Content-Type': 'application/json' },
                        body: JSON.stringify(data)
                    });
                    const result = await res.json();
                    if (result.success) {
                        // Custom toast or alert?
                        const btn = e.submitter;
                        const originalText = btn.innerText;
                        btn.innerText = 'Matched!';
                        btn.style.background = 'var(--success-color)';
                        setTimeout(() => {
                            alert('Reservation Successful!');
                            btn.innerText = originalText;
                            btn.style.background = '';
                            calendar.refetchEvents();
                            document.getElementById('reservationModal').classList.remove('show');
                            e.target.reset();
                        }, 500);
                    } else {
                        alert('Error: ' + result.message);
                    }
                } catch (err) { console.error(err); }
            };
        });

        function toggleHistory(checkbox) {
            if (!window.calendarRef) return;
            const source = checkbox.checked ? '/api/reservations?history=true' : '/api/reservations';
            window.calendarRef.getEventSources().forEach(s => s.remove());
            window.calendarRef.addEventSource(source);
        }
    </script>
</body>

</html>
